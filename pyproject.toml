[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "assetforge"
version = "0.2.0"
description = "AssetForge AI asset production pipeline MVP"
requires-python = ">=3.10"
dependencies = ["Pillow>=11.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
assetforge = "assetforge.runner:main"

[tool.setuptools.packages.find]
include = ["assetforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
