version: "1.0"
status: "Awaiting Approval"

iteration:
  id: 5
  name: "Aim"
  progress: "50%"

description: >
  Produce the reusable aiming package for the locked soldier. Preserve the
  established identity, camera profile, scale, clothing, equipment, and rifle while
  changing the action to a stable combat-ready aiming pose with a clear sight line.

input:
  required:
    - Front.png
    - Back.png
    - Left.png
    - Right.png

tasks:
  - Preserve the locked character identity and equipment
  - Generate the configured camera views in a consistent aiming action
  - Keep the rifle shouldered and the sight line readable at game-sprite scale
  - Maintain a stable stance suitable for transition into the shooting action
  - Export a reusable aiming package

output:
  package: "Iteration_05_Aim.zip"

qa:
  identity_match: required
  camera_registered: required
  scale_locked: required
  equipment_locked: required
  transparent_background: required
  weapon_alignment: required
  sight_line_readability: required
  transition_to_shoot: required

next_iteration:
  id: 6
